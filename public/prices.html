<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prices</title>
  <meta name="description" content="Our prices for common car repairs and services.">
  <meta name="theme-color" content="#14213d">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2314213d'/%3E%3Cpath fill='%23fff' d='M17.5 4a4.5 4.5 0 0 0-4.2 6.1L5.2 18.2a1.6 1.6 0 0 0 2.3 2.3l8.1-8.1A4.5 4.5 0 0 0 21.5 8.5l-2.8 2.8-2-.5-.5-2 2.8-2.8A4.5 4.5 0 0 0 17.5 4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="/">
        <svg width="36" height="36" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="5" fill="#c2410c"/><path fill="#fff" d="M17.5 4a4.5 4.5 0 0 0-4.2 6.1L5.2 18.2a1.6 1.6 0 0 0 2.3 2.3l8.1-8.1A4.5 4.5 0 0 0 21.5 8.5l-2.8 2.8-2-.5-.5-2 2.8-2.8A4.5 4.5 0 0 0 17.5 4z"/></svg>
        <span id="shop-name">Mechanic Shop</span>
      </a>
      <div class="head-actions">
        <a class="head-link" href="/#book">Book</a>
        <a class="btn btn-light btn-small call-top" id="call-top" href="#" hidden>
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1z"/></svg>
          <span class="call-word">Call</span><span class="call-num" id="call-top-num"></span>
        </a>
      </div>
    </div>
  </header>

  <main id="main">
    <section>
      <div class="wrap">
        <h1>Prices</h1>
        <p class="muted">Prices are a guide. The final price depends on your car.</p>

        <div id="loading" class="loading"><span class="spinner" aria-hidden="true"></span>Loading prices&hellip;</div>
        <div id="load-error" hidden>
          <p class="notice bad">We couldn't load the prices. Please check your internet and try again.</p>
          <button type="button" class="btn btn-ghost btn-block" id="retry">Try again</button>
        </div>
        <ul class="price-list" id="prices" hidden></ul>

        <div class="price-cta">
          <a class="btn btn-big btn-block" href="/#book">Book an appointment</a>
          <p class="muted" id="ask" hidden></p>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <div>&copy; <span id="year"></span> <span id="foot-name">Mechanic Shop</span></div>
      <a href="/admin">Owner login</a>
    </div>
  </footer>

  <script type="module" src="/prices.js"></script>
</body>
</html>
